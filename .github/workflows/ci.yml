# Vérification de Secret Guard à chaque poussée et à chaque demande de fusion : module racine (Apache-2.0) et module
# expurgation (dossier expurgation/, PolyForm Small Business 1.0.0).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Moteur Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go vet (GOOS=windows)
        run: GOOS=windows go vet ./...
      - name: go vet, module expurgation
        working-directory: expurgation
        run: go vet ./... && GOOS=windows go vet ./...
      - name: Identifiant SPDX de chaque fichier source (Apache-2.0 ; PolyForm sous expurgation/)
        run: go run ./tools/spdxcheck
      - name: Le moteur ne dépend pas de l'expurgation
        run: |
          if go list -deps -test ./... | grep -q '^github.com/xsom-consulting/secret-guard/expurgation'; then
            echo "::error::un paquet du module racine importe le module expurgation"
            exit 1
          fi
      - name: golangci-lint (depguard compris)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: golangci-lint, module expurgation
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: expurgation
      - name: go test (couverture)
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: go test (couverture), module expurgation
        working-directory: expurgation
        run: go test -count=1 -coverprofile=coverage.out ./...
      - name: "Expurgation : vecteurs, corpus et résidus du masquage (vectors/expurgate.json)"
        working-directory: expurgation
        run: go test -count=1 -v -run '^(TestExpurgateVectors|TestExpurgateCorpus|TestExpurgateRedactResiduals|TestLicense)$' .
      # Déjà exécutée par go test : cette étape la nomme et l'affiche dans le journal (nombre de cas, identifiants en
      # écart, jamais une entrée).
      - name: "Parité à 100 % avec Secret Guard (vectors/detection/, 903 cas : 823 de l'original, 80 de données personnelles)"
        run: go test -count=1 -v -run '^TestParity$' ./detect
      - name: "Parité du masquage et des décisions (vectors/redact.json, vectors/decision.json)"
        run: go test -count=1 -v -run '^(TestRedactParity|TestDecisionParity|TestRedactLeavesNoValue)$' ./detect
      - name: "Parité à 100 % avec hidden.ts et mentionedPaths (vectors/hidden.json, vectors/mentions.json)"
        run: go test -count=1 -v -run '^(TestHiddenParity|TestMentionsParity)$' ./hidden ./mentions
      - name: "Parité à 100 % des règles du client avec le moteur d'origine (vectors/custom/, écarts déclarés vérifiés)"
        run: go test -count=1 -v -run '^(TestCustomPackParity|TestCustomPatternParity|TestCustomDetectionParity|TestCustomTermsParity|TestCustomUnicodeParity|TestCustomScanParity|TestCustomRedactParity)$' ./custom ./detect
      - name: Couverture du moteur (detect, pack, custom, hidden, mentions, internal ≥ 80 %)
        run: go run ./tools/covercheck coverage.out
      - name: Couverture de l'expurgation (expurgation, internal ≥ 80 %)
        run: go run ./tools/covercheck -module expurgation expurgation/coverage.out
      - name: depguardcheck (chaque import interdit est refusé, deux modules)
        if: runner.os == 'Linux'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go run ./tools/depguardcheck
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          (cd expurgation && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...)

  wasm:
    name: WebAssembly (wasip1) et essai sous Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: go vet (GOOS=wasip1)
        run: GOOS=wasip1 GOARCH=wasm go vet ./... && (cd expurgation && GOOS=wasip1 GOARCH=wasm go vet ./...)
      - name: Construire le module WebAssembly (module expurgation, qui l'embarque)
        working-directory: expurgation
        run: GOOS=wasip1 GOARCH=wasm go build -trimpath -buildvcs=false -ldflags="-s -w" -buildmode=c-shared -o ../dist/secret-guard.wasm ./cmd/secret-guard-wasm
      - name: Construire la ligne de commande pour WASI
        run: GOOS=wasip1 GOARCH=wasm go build -trimpath -o dist/secret-guard-cli.wasm ./cmd/secret-guard
      - name: Essais sous Node (node:wasi et couche WASI minimale ; importations en liste fermée)
        run: node --test wasm/secret-guard.test.mjs
      - name: "Parité du module avec le moteur Go natif (corpus complet, deux chargeurs)"
        run: node --test wasm/parity.test.mjs
      - name: Paquet npm (contenu, exports, chargement ; rien n'est publié)
        run: node --test wasm/package.test.mjs
      - name: Types publiés du paquet (tsc du générateur)
        run: |
          npm ci --prefix generator --ignore-scripts
          generator/node_modules/.bin/tsc -p wasm/tsconfig.json
      - name: Mesures (taille, démarrage, analyse de 64 Kio ; indicatives)
        run: node --no-warnings wasm/bench.mjs | tee dist/bench.json
      - uses: actions/upload-artifact@v7
        with:
          name: secret-guard-wasm
          path: dist/
          retention-days: 14

  generator:
    name: Générateur TypeScript (Pack initial, motifs, corpus, vecteurs hidden, mentions et règles du client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  secrets:
    name: Recherche de secrets (gitleaks, historique complet et dossier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "${archive}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
      - name: gitleaks git
        run: gitleaks git . --redact --no-banner
      - name: gitleaks dir
        run: gitleaks dir . --redact --no-banner
