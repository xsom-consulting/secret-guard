# Release du module WebAssembly et du paquet npm @xsom-consulting/secret-guard-wasm, sur poussée d'une étiquette vX.Y.Z.
#
# 1. build : vérifie l'étiquette (= version de wasm/package.json), construit le module (-trimpath, Go de go.mod), le
#    vérifie (construction reproductible : -trimpath -buildvcs=false ; essais Go du module, essais sous Node, parité avec le moteur Go natif sur tout le corpus, paquet), prépare
#    l'archive npm, calcule SHA256SUMS, signe une attestation de provenance (Sigstore, actions/attest-build-provenance)
#    pour chaque fichier, puis crée la Release GitHub avec ces fichiers.
# 2. npm : publie l'archive construite en 1 (jamais reconstruite), avec la provenance npm, dans l'environnement « npm »
#    (règle de protection : approbation de la personne qui publie). Publication de confiance (OIDC) si elle est
#    configurée sur npmjs.com pour ce paquet ; sinon jeton NPM_TOKEN de l'environnement (première publication).
#
# Vérifier une Release : sha256sum -c SHA256SUMS ; gh attestation verify secret-guard.wasm -R xsom-consulting/secret-guard
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Construire, vérifier, attester et publier la Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # création de la Release
      id-token: write # signature Sigstore des attestations
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Version de l'étiquette
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          expected="$(node -p "require('./wasm/package.json').version")"
          if [ "$version" != "$expected" ]; then
            echo "::error::étiquette $TAG, wasm/package.json en version $expected"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Essais Go du module et de l'expurgation
        run: go test -count=1 ./cmd/secret-guard-wasm ./internal/...
      - name: Construire le module WebAssembly
        run: GOOS=wasip1 GOARCH=wasm go build -trimpath -buildvcs=false -ldflags="-s -w" -buildmode=c-shared -o dist/secret-guard.wasm ./cmd/secret-guard-wasm
      - name: Essais sous Node (deux chargeurs, importations en liste fermée)
        run: node --test wasm/secret-guard.test.mjs
      - name: "Parité du module avec le moteur Go natif (corpus complet)"
        run: node --test wasm/parity.test.mjs
      - name: Paquet npm (contenu, exports, chargement)
        run: node --test wasm/package.test.mjs
      - name: Préparer et empaqueter
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node wasm/stage.mjs --out dist/npm --version "$VERSION"
          tarball="$(cd dist && npm pack ./npm --ignore-scripts --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8"))[0].filename)')"
          mkdir -p release
          cp dist/secret-guard.wasm "release/secret-guard.wasm"
          cp "dist/$tarball" "release/$tarball"
          (cd release && sha256sum secret-guard.wasm "$tarball" > SHA256SUMS && cat SHA256SUMS)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Attestation de provenance signée (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/secret-guard.wasm
            release/${{ steps.pack.outputs.tarball }}
            release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 30
          if-no-files-found: error
      - name: Créer la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          {
            echo "Module WebAssembly (WASI preview 1) et paquet npm \`@xsom-consulting/secret-guard-wasm@${TAG#v}\`."
            echo
            echo "SHA-256 :"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo
            echo "Vérifier : \`sha256sum -c SHA256SUMS\` puis \`gh attestation verify secret-guard.wasm -R ${GITHUB_REPOSITORY}\`."
            echo "Construit par ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} depuis ${GITHUB_SHA}."
          } > release-notes.md
          gh release create "$TAG" --verify-tag --title "Secret Guard $TAG" --notes-file release-notes.md \
            release/secret-guard.wasm "release/$TARBALL" release/SHA256SUMS

  npm:
    name: Publier sur npm (archive de la Release, provenance npm)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance npm et publication de confiance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Vérifier les empreintes de l'archive construite
        run: cd release && sha256sum --check --strict SHA256SUMS
      - name: Publier
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "release/$TARBALL" --provenance --access public --ignore-scripts
